name: Evaluation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evaluation/requirements-dev.txt
      - run: python -m pip install -r evaluation/requirements-dev.txt
      - run: python -m pytest evaluation/tests
